name: Rilis Otomatis APK Vanz Music

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil Kode dari Repositori
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # PERBAIKAN: Membuat file gradlew otomatis jika hilang di repositori
      - name: Pasang Mesin Perakit Otomatis (Gradle Wrapper)
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Rakit APK Tanpa Beban PC Lokal
        run: ./gradlew assembleDebug

      - name: Simpan dan Upload Hasil APK Jadi
        uses: actions/upload-artifact@v4
        with:
          name: Vanz-Music-App-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
